<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page_title|default('Credit Risk AI') }} · Credit Risk AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <div class="bg-blur bg-green"></div>
    <div class="bg-blur bg-red"></div>
    <div class="container">
      <header class="topbar">
        <a class="brand" href="/">
          <div class="brand-icon"><i class="fa-solid fa-shield-heart"></i></div>
          <div><span class="eyebrow">Risk Intelligence</span><h1>Credit Risk AI</h1></div>
        </a>
        <nav class="primary-nav" aria-label="Navigation principale">
          <a href="/" {% if active_page == 'dashboard' %}aria-current="page"{% endif %}><i class="fa-solid fa-chart-line"></i> Performances</a>
          <a href="/prediction" {% if active_page == 'prediction' %}aria-current="page"{% endif %}><i class="fa-solid fa-user-check"></i> Prédiction</a>
          <a href="/historique" {% if active_page == 'history' %}aria-current="page"{% endif %}><i class="fa-solid fa-clock-rotate-left"></i> Historique</a>
        </nav>
        <div class="status-pill" id="modelStatus">
          <i class="fa-solid fa-signal"></i>
          <span>Chargement...</span>
        </div>
      </header>
      <main class="dashboard {{ page_class|default('') }}">
        {% block content %}{% endblock %}
      </main>
    </div>
    <script src="/static/js/app.js"></script>
  </body>
</html>
